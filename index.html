<!doctype html>
<html lang="id">
<head>
  <link rel="stylesheet" href="https://silverhawk.web.id/lock/lock.css">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Fairy Finder ✨ Which fairy are you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <body data-shlock-mode="ultimate" data-shlock-domain="" data-shlock-brand="Fairy Finder" data-shlock-social="https://dai.ly/xaud97u,https://www.tiktok.com/@akunsiapa822/video/7682662539351690504">
<header><div class="logo">🦋 Fairy Finder</div><button id="musicBtn">🎵 Turn On Music</button></header>
<div class="sparkles" aria-hidden="true">✦　✧　⋆　✦　✧　⋆　✦　✧　⋆　✦</div>
<main>
<section id="welcome" class="screen active">
  <div class="hero-art"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="castle">🏰</div><div class="fairy">🧚🏻‍♀️</div><div class="butterfly b1">🦋</div><div class="butterfly b2">🦋</div></div>
  <p class="eyebrow">✦ discover your fairy self ✦</p>
  <h1>FAIRY<br><span>FINDER</span></h1><h2>Which fairy are you? ✨</h2>
  <p class="lead">A tiny quiz to reveal your magical personality.</p>
  <button class="primary" id="startBtn">START THE MAGIC ✨</button>
  <div class="sticker">dream<br>believe<br>be you ♡</div>
</section>

<section id="quiz" class="screen">
  <div class="quizTop"><span id="count">1 / 7</span><div class="progress"><i id="bar"></i></div></div>
  <div class="question-card"><div class="q-deco">✦ 🦋 ✿</div><p class="eyebrow">a little magical question...</p><h2 id="question"></h2><div id="answers"></div></div>
  <div class="nav"><button class="secondary" id="backBtn">← Back</button><button class="primary small" id="nextBtn">Next →</button></div>
</section>

<section id="result" class="screen">
  <div class="result-aura"><div class="result-fairy" id="resultEmoji">🧚🏻‍♀️</div></div>
  <p class="eyebrow">YOU ARE...</p><h1 id="resultName"></h1><p class="quote" id="resultQuote"></p>
  <div class="traits" id="traits"></div>
  <div class="result-actions"><button class="secondary" id="retake">RETAKE QUIZ ↻</button><button class="primary" id="share">SHARE MY RESULT ✨</button></div>
</section>
</main>
<audio id="bgm" src="fairy-music.mp3" loop></audio>
<script src="script.js"></script>
<script src="https://silverhawk.web.id/lock/lock.js"></script>
  </body></html>
